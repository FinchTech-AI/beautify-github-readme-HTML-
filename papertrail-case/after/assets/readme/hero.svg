<g font-family="Segoe UI,Microsoft YaHei,sans-serif" fill="#202e28">
<text x="56" y="55" font-size="20" letter-spacing="3" fill="#426b57">A QUIETER WAY TO READ PAPERS</text>
<text x="52" y="164" font-family="Georgia,serif" font-size="100">PaperTrail<tspan fill="#426b57">.</tspan></text>
<text x="57" y="229" font-size="36">从论文，到有出处的笔记。</text>
<path d="M58 264 H628" stroke="#b9c7b7" stroke-width="2"/>
